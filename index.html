<style>
:root{
  --ink:#10161c; --paper:#ffffff; --surface:#f4f6f4; --rule:#d9e0da;
  --accent:#0f6e63; --accent-soft:#e3efec; --amber:#8a5a12; --amber-soft:#f8efdd;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:26px 26px 30px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
h1{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:30px 0 10px}
h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px;font-weight:700}
p{margin:0 0 12px}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.wrap{padding:16px 12px 60px}.card{padding:18px}}
label.f{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 5px}
input[type=text],input[type=number],select{width:100%;padding:10px 11px;border:1px solid var(--rule);border-radius:2px;font-family:var(--ui);font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--ui);font-size:15px;font-weight:600;padding:12px 22px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--ink)}
button:disabled{opacity:.35;cursor:not-allowed}
.rules{background:var(--surface);border-left:3px solid var(--accent);padding:14px 16px;font-size:14.5px;margin:0 0 18px}
.rules ul{margin:8px 0 0;padding-left:18px}
.rules li{margin-bottom:5px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:16px 0 20px}
.chk input{margin-top:3px;width:16px;height:16px;flex:0 0 auto}

.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border:1px solid var(--rule);border-bottom:none;padding:12px 16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.rail b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:5px;background:var(--rule);margin:0;position:relative;overflow:hidden}

@media(prefers-reduced-motion:reduce){.meter i{transition:none}}

.casebox{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:15px 17px;margin:0 0 18px;font-family:var(--serif);font-size:16.5px;line-height:1.55}

.stem{font-family:var(--serif);font-size:18px;line-height:1.55;margin:16px 0 18px}

.opt.no{border-color:var(--alert);background:var(--alert-soft)}

.fb{margin:18px 0 0;padding:15px 17px;border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--surface);font-size:15px}
.fb.wrong{border-left-color:var(--alert)}

.fb.wrong .h{color:var(--alert)}
.tags{margin-top:12px;font-size:11.5px;color:var(--muted);font-family:var(--mono);line-height:1.7}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 18px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:var(--rule);width:110px;display:inline-block;vertical-align:middle;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar.low i{background:var(--alert)}
.bar.mid i{background:var(--amber)}

.verdict{border:1px solid var(--rule);padding:22px;margin:0 0 22px;background:var(--surface)}
.verdict .score{font-family:var(--serif);font-size:52px;line-height:1;font-weight:600;letter-spacing:-.02em}
.verdict.pass{border-left:4px solid var(--accent)}
.verdict.fail{border-left:4px solid var(--amber)}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums;font-weight:600}
.rx{border:1px solid var(--rule);padding:16px 18px;margin:0 0 14px;background:#fff}
.rx .t{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:4px}
.rx .pct{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
.rx .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:12px 0 4px}
.receipt{font-family:var(--mono);font-size:11.5px;line-height:1.6;background:var(--ink);color:#e6ece8;padding:16px;overflow-x:auto;white-space:pre;border-radius:2px}
.note{font-size:13px;color:var(--muted)}
.hide{display:none}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);padding:1px 5px;border-radius:2px;background:var(--surface)}

const BANK = {"courseCode": "PMHNP-PSYCHOPHARM", "module": "2", "week": 2, "mode": "mastery", "passing": 90, "cap": 100, "minItems": 30, "window": 20, "examLength": 0, "title": "Pharmacokinetics, Metabolism, and Drug Targets", "subtitle": "Mastery activity. Continue until you demonstrate 90% mastery across every content area sampled.", "rules": ["Items are delivered one at a time and become progressively harder as you go.", "You receive the correct answer and a full rationale after each item.", "The activity ends when you reach 90% overall, hold 90% across your most recent 20 items, and leave no content area below standard.", "If you reach 100 items without meeting the standard, the activity stops and returns a study prescription. Return and attempt again after you have studied.", "Each new attempt draws a different set of items, weighted toward material you have not yet seen.", "Your elapsed time and attempt number are recorded and reported to the course faculty."], "courseObjectives": {"1": "Examine the role of the psychiatric-mental health prescriber within legal, ethical, and regulatory parameters.", "2": "Apply neuroscience, pharmacodynamic, and pharmacokinetic principles to psychopharmacologic decision making.", "3": "Formulate evidence-based pharmacologic treatment plans across psychiatric diagnoses.", "4": "Integrate patient-specific factors, preferences, and adherence considerations into treatment planning.", "5": "Evaluate and manage adverse drug reactions, toxicities, and psychiatric emergencies.", "6": "Apply prescribing considerations across the lifespan and in special populations.", "7": "Analyze and apply current evidence, guidelines, and trial findings to real-world practice.", "8": "Demonstrate safe prescribing through monitoring, documentation, and interprofessional collaboration.", "9": "Develop a plan for continuing professional development in psychopharmacology."}, "moduleObjectives": {"1": "Investigate the relationship of receptor affinity and the agonist spectrum.", "2": "Examine the transduction from first messenger to protein synthesis and variations therein.", "3": "Examine second messenger systems and their associated signal transduction cascades.", "4": "Explain the role of kinase in signal transduction cascades.", "5": "Evaluate the effects of stress on neuroplasticity.", "6": "Evaluate how pharmacokinetics and pharmacodynamics differ.", "7": "Analyze the four phases of pharmacokinetics, including factors that affect each phase, as they relate to drug efficacy.", "8": "Apply concepts of phase I and phase II metabolism, half-life, and saturation kinetics to medication safety and efficacy.", "9": "Apply knowledge of the cytochrome P450 system to drug-drug interactions."}, "domains": {"1": "Knowledge for Nursing Practice", "2": "Person-Centered Care", "3": "Population Health", "4": "Scholarship for the Nursing Discipline", "5": "Quality and Safety", "6": "Interprofessional Partnerships", "7": "Systems-Based Practice", "8": "Informatics and Healthcare Technologies", "9": "Professionalism", "10": "Personal, Professional, and Leadership Development"}, "topics": {"pkpd": {"name": "Distinguishing pharmacokinetics from pharmacodynamics", "study": "Fix the two definitions so firmly that you can classify any clinical problem instantly. Pharmacokinetics is what the body does to the drug: absorption, distribution, metabolism, and elimination, all of which determine the concentration that reaches the target and how long it stays there. Pharmacodynamics is what the drug does to the body: receptor binding, intrinsic activity, downstream signaling, and the resulting clinical and adverse effects. The reason this matters is diagnostic. When a patient fails to respond, the question is always which of the two failed. A pharmacokinetic failure means the drug never reached an adequate concentration, from nonadherence, poor absorption, rapid metabolism, an enzyme inducer, or a transporter blocking central entry. A pharmacodynamic failure means adequate concentration reached the target and the target did not respond as needed, which calls for a different mechanism rather than a higher dose. Practice sorting real scenarios into these two categories before deciding what to do, because the corrective action is completely different in each case.", "stahl": "The chapter on pharmacokinetics and drug interactions, read against the pharmacodynamics chapter, attending to how each contributes to individual variation in response.", "kaplan": "The general principles of psychopharmacology chapter, particularly the sections separating kinetic from dynamic sources of variability.", "media": "Search for lectures contrasting pharmacokinetics and pharmacodynamics in clinical decision making, and on troubleshooting nonresponse in psychopharmacology."}, "absorb": {"name": "Absorption, bioavailability, and first-pass metabolism", "study": "Understand why the dose swallowed is not the dose delivered. Absorption from the gastrointestinal tract depends on formulation, dissolution, gastric pH, gastrointestinal motility, food, and the presence of binding agents; separation intervals matter when a cation-containing product can chelate a drug. Absorbed drug then travels through the portal circulation to the liver, where first-pass metabolism can remove a substantial fraction before it ever reaches systemic circulation. Bioavailability is the fraction of the administered dose reaching systemic circulation unchanged, and it is by definition complete for the intravenous route. Routes that bypass the portal circulation, including sublingual, transdermal, intranasal, rectal, and intramuscular administration, avoid or reduce first pass and can produce markedly higher exposure for the same milligram amount, which is why milligram-for-milligram substitution across routes is unsafe. Efflux transporters, especially P-glycoprotein in the intestinal epithelium, actively pump absorbed drug back into the lumen and reduce net absorption; inhibiting that pump raises exposure and inducing it lowers exposure. Lipophilicity aids membrane crossing but also increases susceptibility to first-pass extraction and to sequestration in fat.", "stahl": "The pharmacokinetics chapter sections on absorption, bioavailability, formulation differences, and P-glycoprotein.", "kaplan": "The general principles of psychopharmacology chapter, sections on routes of administration and bioavailability.", "media": "Search for lectures on first-pass metabolism and bioavailability, and on P-glycoprotein as an intestinal and blood-brain barrier efflux transporter."}, "distrib": {"name": "Distribution, protein binding, and central nervous system penetration", "study": "Know what determines whether drug reaches brain and how much of it is actually available to act. Only unbound drug is pharmacologically active and only unbound drug crosses membranes, so plasma protein binding directly shapes both effect and interaction risk. Highly protein-bound drugs can be displaced by another highly bound drug or by hypoalbuminemia, transiently raising the free fraction; recognize that total serum levels can be misleading in this setting because the assay usually measures bound plus unbound drug. Volume of distribution is a calculated relationship between dose and plasma concentration, not an anatomic space: lipophilic drugs that partition into fat have large volumes and long effective durations, while hydrophilic drugs that remain in body water have small volumes. Body composition therefore changes kinetics; increased adipose proportion with aging prolongs the effective half-life of lipophilic agents, and reduced total body water alters concentrations of hydrophilic ones. Crossing into the central nervous system requires lipophilicity and low molecular weight and is opposed by P-glycoprotein efflux at the blood-brain barrier, which is one reason a drug can achieve high plasma levels with little central effect.", "stahl": "The pharmacokinetics chapter sections on distribution, protein binding, lipophilicity, and blood-brain barrier transport.", "kaplan": "The general principles of psychopharmacology chapter and the geriatric psychiatry chapter sections on age-related changes in body composition.", "media": "Search for lectures on volume of distribution and protein binding, and on blood-brain barrier transport of psychotropic drugs."}, "metab": {"name": "Phase I and phase II metabolism", "study": "Separate the two phases by chemistry and by clinical consequence. Phase I reactions modify the molecule through oxidation, reduction, or hydrolysis, and are carried out predominantly by cytochrome P450 enzymes. Phase I frequently produces a metabolite that is still pharmacologically active, sometimes more active than the parent, and prodrugs require phase I activation to work at all. Phase II reactions conjugate the drug or its phase I metabolite with a polar group, most often glucuronic acid through the uridine diphosphate glucuronosyltransferase enzymes, but also by sulfation, acetylation, and methylation. Phase II products are typically inactive and readily excreted. The clinical payoff is substantial. Agents cleared predominantly by conjugation are less affected by cytochrome inhibitors and inducers and are relatively preserved in hepatic impairment and in aging, which is why they are preferred in those settings. Conversely, inhibition of a conjugating enzyme can double the exposure of a drug cleared that way, which is why certain combinations require the dose of one agent to be halved and titrated far more slowly. Know which of the agents you prescribe are prodrugs, which have clinically important active metabolites, and which bypass phase I altogether.", "stahl": "The pharmacokinetics chapter sections on hepatic metabolism, cytochrome P450 enzymes, and glucuronidation, together with the drug-specific metabolism notes in the antidepressant, mood stabilizer, and stimulant chapters.", "kaplan": "The general principles of psychopharmacology chapter sections on drug metabolism, and the corresponding sections of the individual drug class chapters.", "media": "Search for lectures on phase I versus phase II drug metabolism and on glucuronidation and uridine diphosphate glucuronosyltransferase interactions."}, "elim": {"name": "Half-life, steady state, and order of kinetics", "study": "Turn half-life into a set of decisions rather than a number. Approximately four to five half-lives are required to reach steady state after starting a drug or changing a dose, and the same four to five half-lives are required for washout after stopping. That single fact tells you when a serum level is interpretable, when a dose change can be judged, how long a washout must be before starting an interacting agent, and how abruptly discontinuation symptoms will appear. Short half-life predicts pronounced discontinuation phenomena and interdose variability; long half-life predicts self-tapering on discontinuation but also delayed accumulation and delayed manifestation of toxicity. Distinguish the two orders of elimination. First-order elimination removes a constant fraction per unit time, so concentration rises proportionally with dose and half-life is constant; this describes most drugs at usual doses. Zero-order or saturation kinetics removes a constant amount per unit time because the enzyme is saturated, so a small dose increase produces a disproportionate and potentially dangerous rise in concentration and the apparent half-life lengthens as concentration rises. Recognize the agents that shift toward saturation within the therapeutic range, and know that renal elimination of unchanged drug makes hydration status, sodium balance, and glomerular filtration into dosing variables.", "stahl": "The pharmacokinetics chapter sections on half-life, steady state, and elimination, and the mood stabilizer chapter sections on serum level monitoring and toxicity.", "kaplan": "The general principles of psychopharmacology chapter sections on half-life, steady state, and therapeutic drug monitoring.", "media": "Search for lectures on half-life and steady state calculations, and on first-order versus zero-order elimination kinetics."}, "cyp": {"name": "Cytochrome P450 interactions in practice", "study": "Learn this as a small set of high-frequency patterns rather than a table to be memorized whole. For each interaction, identify three roles: the substrate, whose level will change; the perpetrator, which is the inhibitor or inducer; and the enzyme through which they meet. Then predict direction and magnitude. Inhibition reduces metabolism and raises substrate levels, and because most inhibition is competitive it begins with the first dose and resolves as the inhibitor clears. Induction increases enzyme quantity through new protein synthesis and therefore develops over roughly one to three weeks and resolves over a similar period after the inducer is stopped, which creates a delayed toxicity risk when an inducer is discontinued while the substrate dose remains high. Master the enzymes that carry the greatest psychiatric burden. The 2D6 enzyme metabolizes many antidepressants, several antipsychotics, and atomoxetine, and is potently inhibited by several antidepressants; it also activates certain opioid prodrugs, so inhibiting it causes analgesic failure rather than toxicity. The 3A4 enzyme handles a very large fraction of all drugs and is induced by several anticonvulsants and inhibited by certain antifungals, macrolides, protease inhibitors, and intestinal exposure to grapefruit. The 1A2 enzyme is induced by combustion products in tobacco smoke rather than by nicotine, so smoking cessation raises levels of its substrates. The 2C19 enzyme handles several antidepressants and benzodiazepines. Finally, connect enzyme function to genotype: a poor metabolizer accumulates the parent drug and fails to activate prodrugs, while an ultrarapid metabolizer clears the parent drug too quickly and over-activates prodrugs.", "stahl": "The pharmacokinetics and drug interactions chapter, including the cytochrome P450 tables, and the pharmacogenomic sections addressing metabolizer phenotypes.", "kaplan": "The general principles of psychopharmacology chapter sections on drug interactions, and the individual drug class chapters where specific interactions are listed.", "media": "Search for lectures on cytochrome P450 drug interactions in psychiatry, on smoking and cytochrome 1A2 induction, and on pharmacogenomic testing and metabolizer phenotypes."}, "targets": {"name": "The four classes of psychotropic drug target", "study": "Every psychotropic you will prescribe acts on one of four target classes, and you should be able to assign any agent to its class without hesitation. Transporters move transmitter across a membrane and include the plasma membrane monoamine transporters and the vesicular monoamine transporter. G-protein-linked receptors operate through second messenger cascades over seconds to hours and comprise most monoamine receptors. Ligand-gated ion channels are transmitter-gated pores acting in milliseconds and include the gamma-aminobutyric acid type A receptor and the ionotropic glutamate receptors. Voltage-sensitive ion channels open in response to membrane potential rather than transmitter binding and are the target of several anticonvulsant mood stabilizers. Beyond assigning class, learn what the class predicts. Ion channel targets produce rapid onset and rapid offset and are prone to tolerance and withdrawal phenomena. G-protein-linked targets produce slower onset and change gene expression, so their full clinical effect lags occupancy. Enzymatic targets such as monoamine oxidase, when inhibited irreversibly, require synthesis of new enzyme before function returns, which is the basis for prolonged washout requirements.", "stahl": "The chapters on transporters, G-protein-linked receptors, ion channels, and enzymes as targets of psychopharmacologic drug action.", "kaplan": "The neuroscience chapters on neurotransmitters, receptors, and ion channels, together with the introduction to biological therapies.", "media": "Search for lectures on the major classes of psychotropic drug targets and on voltage-gated ion channels as targets of mood stabilizing agents."}, "affinity": {"name": "Receptor affinity and the agonist spectrum", "study": "Build a single mental figure that places every agent you prescribe somewhere on the spectrum from full agonist through partial agonist and silent antagonist to inverse agonist, and be able to predict behavior from position plus context. Affinity determines whether a drug occupies the receptor at achievable concentrations and determines which drug wins when two compete for the same site; intrinsic activity determines what happens once it is bound. A high-affinity partial agonist will displace a full agonist and reduce net signaling in a high-tone system, which is the single most useful prediction in this material. Attend also to dissociation rate, because how quickly an antagonist leaves the receptor determines whether physiologic transmitter surges can still transiently compete with it, and this modifies the side effect burden of equivalent occupancy. Extend the same reasoning to allosteric sites, where a modulator changes the receptor's response to the endogenous transmitter rather than acting on its own, meaning its effect is contingent on endogenous tone. Finally, connect the spectrum to adaptation: sustained agonism tends to downregulate and desensitize, sustained antagonism tends to upregulate and sensitize, and both adaptations are the framework for tolerance, withdrawal, and late-emerging adverse effects.", "stahl": "The chapters on pharmacodynamics and the agonist spectrum, including the comparative output figures, and the antipsychotic chapter sections on partial agonism and dissociation kinetics.", "kaplan": "The general principles of psychopharmacology chapter sections on drug-receptor interaction and the neuroscience chapters on receptor regulation.", "media": "Search for lectures on the agonist spectrum, receptor affinity versus intrinsic activity, and receptor desensitization and upregulation."}, "cascade": {"name": "Signal transduction from first messenger to protein synthesis", "study": "You should be able to draw the full cascade from memory and attach a time constant to each segment. The extracellular transmitter is the first messenger. It binds a G-protein-linked receptor, activating a G protein that either stimulates or inhibits an enzyme, generating a second messenger such as cyclic adenosine monophosphate or the paired products of phospholipase C action, with calcium functioning as a second messenger in its own right. Second messengers activate protein kinases, and the essential idea about kinases is that they attach phosphate groups to target proteins and thereby switch their activity, while phosphatases remove those groups; the ratio of the two sets the operating state of the cell. Kinase activity reaches the nucleus by phosphorylating transcription factors, altering which genes are read. New messenger RNA yields new protein, including receptors, enzymes, structural proteins, and neurotrophic factors. Note the variations: some receptors couple to inhibitory G proteins and reduce second messenger production, some cascades are initiated by receptor tyrosine kinases rather than G proteins, and some responses are terminated by dedicated feedback enzymes. Understand the arithmetic of amplification, in which a single occupied receptor produces many second messenger molecules and each kinase phosphorylates many targets, which explains how low receptor occupancy can produce large cellular effects.", "stahl": "The chapter on signal transduction cascades, including the sections on G proteins, second messengers, kinases and phosphatases, transcription factors, and neurotrophins.", "kaplan": "The neuroscience chapters covering intracellular signaling and gene expression in the nervous system.", "media": "Search for lectures and animations on G-protein-coupled receptor signaling, second messenger cascades, and protein kinase signaling to the nucleus."}, "plasticity": {"name": "Stress, neuroplasticity, and the neurotrophic model", "study": "Learn this as a mechanistic chain rather than a slogan. Acute stress activates the hypothalamic-pituitary-adrenal axis appropriately and the system recovers. Sustained or repeated stress produces prolonged glucocorticoid exposure with impaired negative feedback, and that exposure suppresses neurotrophic signaling. The downstream consequences include reduced brain-derived neurotrophic factor expression, retraction of dendritic arbor and loss of spines in hippocampus and medial prefrontal cortex, reduced adult neurogenesis in the dentate gyrus, and, in contrast, dendritic hypertrophy in the amygdala. This regional divergence is what produces the clinical picture of impaired contextual memory and executive control alongside heightened threat reactivity. Connect the model to treatment: effective antidepressant treatment is associated with restoration of neurotrophic signaling and synaptogenesis, and agents that produce rapid synaptic effects have been of particular interest because they compress the time course of that structural change. Also connect it to development and to risk, since early adversity and repeated episodes both interact with this system, and to the concept that plasticity is bidirectional and therefore a target for intervention rather than a fixed deficit.", "stahl": "The sections linking stress, the hypothalamic-pituitary-adrenal axis, neurotrophic factors, and neuroplasticity to mood and anxiety disorders, together with the chapter material on rapid-acting agents and synaptogenesis.", "kaplan": "The neuroscience chapters on the neurobiology of stress and on the biology of mood disorders.", "media": "Search for lectures on the neurotrophic hypothesis of depression, on stress effects on hippocampal and prefrontal plasticity, and on synaptogenesis and rapid-acting antidepressants."}}, "items": [{"id": "M2-001", "t": 1, "topic": "pkpd", "stem": "A patient's serum drug concentration is far below the expected range despite a standard dose. This finding is best classified as a problem of which kind?", "opts": ["Pharmacodynamics", "Pharmacokinetics", "Receptor affinity", "Intrinsic activity"], "a": 1, "r": "Concentration achieved in the body is a pharmacokinetic outcome, determined by absorption, distribution, metabolism, and elimination. Pharmacodynamics describes what happens at the receptor once the drug arrives. Sorting nonresponse into these two categories before acting is the essential diagnostic move.", "mo": [6], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-002", "t": 2, "topic": "pkpd", "stem": "A patient has a documented therapeutic serum level, confirmed adherence, and an adequate trial duration, yet no symptomatic improvement. Which action follows most logically?", "opts": ["Increase the dose further to overcome the nonresponse", "Recognize this as a pharmacodynamic nonresponse and change to an agent with a different mechanism", "Order genetic testing for absorption transporters", "Repeat the serum level in one week"], "a": 1, "r": "Adequate concentration at the target with no effect means the target is not the problem to be solved by more of the same drug. Escalating dose in a confirmed pharmacodynamic nonresponse adds toxicity without adding benefit. The rational next step is a mechanistically different agent.", "mo": [6], "co": [2, 3], "dom": "2", "comp": "2.6", "con": "Clinical Judgment"}, {"id": "M2-003", "t": 1, "topic": "absorb", "stem": "Which route of administration is defined as having 100 percent bioavailability?", "opts": ["Oral", "Sublingual", "Intravenous", "Intramuscular"], "a": 2, "r": "Bioavailability is the fraction of an administered dose reaching systemic circulation unchanged, and intravenous administration places the entire dose there directly. All other routes are compared against it. This is why milligram-for-milligram substitution across routes is unsafe.", "mo": [7], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-004", "t": 2, "topic": "absorb", "stem": "Why do sublingual, transdermal, and intranasal routes often produce higher exposure than the oral route for the same milligram dose?", "opts": ["They increase renal reabsorption of the drug", "They bypass the portal circulation and therefore avoid or reduce hepatic first-pass metabolism", "They increase plasma protein binding", "They inhibit cytochrome enzymes directly"], "a": 1, "r": "Orally absorbed drug travels through the portal vein to the liver, where a fraction is metabolized before reaching systemic circulation. Routes that drain into the systemic circulation directly avoid that loss. For agents with high first-pass extraction, the difference in exposure between routes can be several-fold.", "mo": [7], "co": [2, 5], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-005", "t": 3, "topic": "absorb", "stem": "P-glycoprotein located in the intestinal epithelium affects drug exposure in which way?", "opts": ["It transports drug from the lumen into the bloodstream, increasing absorption", "It pumps absorbed drug back into the intestinal lumen, reducing net absorption", "It conjugates drug with glucuronic acid before absorption", "It binds drug to albumin in the portal circulation"], "a": 1, "r": "P-glycoprotein is an efflux pump. In the gut it returns absorbed drug to the lumen and reduces net bioavailability, and at the blood-brain barrier it extrudes drug back to the blood and limits central penetration. Inhibiting it raises exposure; inducing it lowers exposure.", "mo": [7], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-006", "t": 3, "topic": "distrib", "stem": "Which property of a drug is the strongest determinant of whether it will produce central nervous system effects?", "opts": ["High plasma protein binding", "Sufficient lipophilicity and small molecular size, with limited susceptibility to efflux transport at the blood-brain barrier", "A large number of hydrogen bond donors", "Rapid renal clearance"], "a": 1, "r": "Crossing into the central nervous system requires the ability to pass a lipid membrane, which favors small lipophilic molecules, and it requires escaping efflux by P-glycoprotein. High protein binding actually reduces the free fraction available to cross, and rapid renal clearance shortens exposure rather than enabling entry.", "mo": [7], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-007", "t": 3, "topic": "distrib", "stem": "A malnourished patient with hypoalbuminemia is taking a highly protein-bound anticonvulsant mood stabilizer. The total serum level is within the usual range, but the patient shows signs of toxicity. What is the best explanation?", "opts": ["The assay is malfunctioning", "Reduced albumin increases the unbound, pharmacologically active fraction, so a normal total level can correspond to a toxic free level", "Hypoalbuminemia accelerates hepatic metabolism", "Protein binding has no relationship to drug effect"], "a": 1, "r": "Only unbound drug is active. When albumin falls, the same total concentration contains a larger free fraction, so toxicity can occur at an apparently therapeutic total level. Standard assays report total drug, which is why the clinical picture must be weighted over the number in this setting, and why a free level should be considered when available.", "mo": [7, 8], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-008", "t": 3, "topic": "distrib", "stem": "An older adult has a higher proportion of body fat and reduced total body water compared with a younger adult. What is the expected effect on a highly lipophilic psychotropic?", "opts": ["Reduced volume of distribution and shortened effective half-life", "Increased volume of distribution and prolonged effective half-life, with greater accumulation risk", "No change, because volume of distribution is fixed by the drug", "Increased renal clearance offsetting any change"], "a": 1, "r": "Lipophilic drugs partition into adipose tissue, so an increased fat compartment increases the volume of distribution and lengthens the time required for elimination. The practical consequences are delayed accumulation, delayed steady state, and prolonged effects after discontinuation, all of which argue for lower starting doses and slower titration in older adults.", "mo": [7], "co": [2, 6], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-009", "t": 1, "topic": "metab", "stem": "Which reaction type characterizes phase I metabolism?", "opts": ["Conjugation with glucuronic acid", "Oxidation, reduction, or hydrolysis, largely by cytochrome P450 enzymes", "Acetylation by N-acetyltransferase", "Sulfation by sulfotransferase"], "a": 1, "r": "Phase I modifies the drug molecule through oxidation, reduction, or hydrolysis and is predominantly carried out by cytochrome P450 enzymes. All the other options listed are phase II conjugation reactions.", "mo": [8], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-010", "t": 2, "topic": "metab", "stem": "Which statement about phase II metabolism is most accurate?", "opts": ["It always precedes phase I", "It generally produces a more water-soluble, pharmacologically inactive product suitable for excretion", "It generally produces a metabolite more active than the parent compound", "It occurs exclusively in the kidney"], "a": 1, "r": "Conjugation adds a polar group, increasing water solubility and generally abolishing activity, which prepares the compound for renal or biliary excretion. Phase II can occur with or without prior phase I. It occurs principally in the liver, though other tissues contribute.", "mo": [8], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-011", "t": 3, "topic": "metab", "stem": "Why are benzodiazepines cleared predominantly by glucuronidation generally preferred in a patient with significant hepatic impairment?", "opts": ["They have a shorter half-life than all other benzodiazepines", "Conjugation capacity is relatively better preserved than oxidative capacity in hepatic impairment, so accumulation risk is lower", "They are not absorbed from the gastrointestinal tract", "They act at a different receptor with less respiratory risk"], "a": 1, "r": "Oxidative phase I capacity declines earlier and more severely than conjugation capacity in liver disease and in aging. Agents that bypass phase I therefore accumulate less and are less vulnerable to cytochrome-mediated interactions. All benzodiazepines act at the same receptor complex, so the advantage is kinetic, not dynamic.", "mo": [8], "co": [2, 5, 6], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-012", "t": 3, "topic": "metab", "stem": "A prodrug produces no clinical effect in a patient who is a genetically poor metabolizer at the enzyme that activates it. What is the mechanism of this failure?", "opts": ["The parent compound accumulates to toxic levels and blocks the receptor", "The parent compound is not converted to its active metabolite in sufficient quantity", "The active metabolite is eliminated too rapidly by the kidney", "The prodrug binds irreversibly to plasma proteins"], "a": 1, "r": "A prodrug is inactive as administered and depends on metabolic conversion. Poor metabolizer status at the activating enzyme means the active species is never generated in adequate amounts, producing therapeutic failure rather than toxicity. Ultrarapid metabolizer status at the same enzyme produces the opposite problem, excessive active metabolite.", "mo": [8, 9], "co": [2, 5], "dom": "1", "comp": "1.2", "con": "Clinical Judgment"}, {"id": "M2-013", "t": 1, "topic": "elim", "stem": "Approximately how many half-lives are required for a drug to reach steady state after a dose change?", "opts": ["One to two", "Four to five", "Ten to twelve", "Twenty or more"], "a": 1, "r": "Four to five half-lives brings the drug to approximately 94 to 97 percent of steady state, which is the practical threshold. The same interval applies to washout after discontinuation. This single number tells you when a level is interpretable and when a dose change can fairly be judged.", "mo": [8], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-014", "t": 2, "topic": "elim", "stem": "Which clinical consequence is most characteristic of an agent with a very short half-life?", "opts": ["Delayed onset of any discontinuation symptoms", "Pronounced interdose variability and prominent discontinuation symptoms if a dose is missed", "Prolonged accumulation with delayed toxicity", "Self-tapering on abrupt discontinuation"], "a": 1, "r": "Short half-life means concentration falls substantially between doses and falls quickly after a missed dose, producing both interdose fluctuation and abrupt discontinuation phenomena. Long half-life produces the opposite profile: delayed accumulation, delayed toxicity, and a degree of self-taper on stopping.", "mo": [8], "co": [2, 5], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-015", "t": 3, "topic": "elim", "stem": "A drug demonstrates zero-order, or saturation, kinetics within the therapeutic range. What is the clinical implication?", "opts": ["Concentration rises in direct proportion to dose, making titration predictable", "A small dose increase can produce a disproportionately large rise in concentration, and the apparent half-life lengthens as concentration rises", "Half-life is constant regardless of concentration", "The drug cannot be measured by serum assay"], "a": 1, "r": "When the eliminating enzyme is saturated, a constant amount rather than a constant fraction is removed per unit time. Adding drug then produces a nonlinear rise in concentration and a lengthening apparent half-life. This is why agents with saturation kinetics require small increments, longer intervals between changes, and level checks after every adjustment.", "mo": [8], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-016", "t": 2, "topic": "elim", "stem": "A drug is eliminated unchanged by the kidney. Which patient variables most directly affect its serum concentration?", "opts": ["Hepatic enzyme genotype and concurrent enzyme inhibitors", "Glomerular filtration rate, hydration status, and sodium balance", "Plasma protein binding and body fat percentage", "Gastric pH and intestinal motility"], "a": 1, "r": "For renally cleared agents, kidney function and volume status are the dosing variables. Dehydration, sodium depletion, and medications that reduce renal clearance raise levels, sometimes into the toxic range without any change in the prescribed dose. Hepatic enzyme variables are largely irrelevant for these agents.", "mo": [7, 8], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-017", "t": 2, "topic": "cyp", "stem": "A potent enzyme inhibitor is added to a regimen containing a substrate of that enzyme. What is the expected onset and direction of the interaction?", "opts": ["Substrate levels fall, beginning after one to three weeks", "Substrate levels rise, beginning essentially with the first doses of the inhibitor", "Substrate levels rise, beginning after one to three weeks", "Substrate levels fall, beginning immediately"], "a": 1, "r": "Most clinically important inhibition is competitive and therefore begins as soon as the inhibitor reaches effective concentration, raising substrate levels within days. Induction, by contrast, requires synthesis of new enzyme protein and develops over one to three weeks. Confusing these two time courses is a common source of missed interactions.", "mo": [9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-018", "t": 3, "topic": "cyp", "stem": "An enzyme inducer is discontinued while the dose of a substrate drug is left unchanged. What is the principal risk?", "opts": ["Immediate loss of efficacy of the substrate", "Gradual rise in substrate concentration over one to three weeks as enzyme quantity returns to baseline, with delayed toxicity", "No change, because induction is not reversible", "Immediate toxicity within hours of stopping the inducer"], "a": 1, "r": "De-induction requires degradation of the excess enzyme, which takes roughly the same one to three weeks that induction took. Substrate levels therefore climb quietly toward toxicity after the inducer is stopped. Whenever an inducer is discontinued, substrate doses must be reviewed and levels rechecked over the following weeks.", "mo": [9], "co": [2, 5, 8], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-019", "t": 2, "topic": "cyp", "stem": "Which component of tobacco smoke is responsible for induction of cytochrome 1A2?", "opts": ["Nicotine", "Polycyclic aromatic hydrocarbons produced by combustion", "Carbon monoxide", "Menthol"], "a": 1, "r": "Induction is caused by combustion products, not nicotine. This has a direct clinical consequence: nicotine replacement therapy does not maintain the induction, so a patient who stops smoking but uses a patch will still experience rising levels of 1A2 substrates. Vaping likewise does not reliably reproduce the induction.", "mo": [9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-020", "t": 3, "topic": "cyp", "stem": "Grapefruit juice raises levels of certain drugs primarily through which mechanism?", "opts": ["Induction of hepatic cytochrome 3A4", "Irreversible inhibition of intestinal cytochrome 3A4, increasing the absorbed fraction", "Displacement of drug from plasma proteins", "Inhibition of renal tubular secretion"], "a": 1, "r": "The dominant effect is on intestinal 3A4, which is inhibited in a long-lasting, mechanism-based manner, so more drug survives the intestinal wall and reaches circulation. Because the enzyme must be resynthesized, the effect persists well beyond the time the juice is consumed, and separating the two in time does not reliably avoid the interaction.", "mo": [9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-021", "t": 3, "topic": "cyp", "stem": "A patient is identified as a cytochrome 2D6 ultrarapid metabolizer. Which two consequences should be anticipated?", "opts": ["Higher levels of 2D6 substrate parent drugs and reduced formation of active metabolites", "Lower levels of 2D6 substrate parent drugs with possible therapeutic failure, and increased formation of active metabolites from prodrugs with possible toxicity", "No clinically meaningful change in either direction", "Reduced renal clearance of all psychotropics"], "a": 1, "r": "Ultrarapid metabolism clears substrates faster, so standard doses may never reach therapeutic concentrations. For prodrugs requiring 2D6 activation, the same phenotype generates excessive active metabolite and creates toxicity risk. The same genotype therefore causes opposite problems depending on whether the drug is a substrate or a prodrug.", "mo": [9], "co": [2, 5, 6], "dom": "1", "comp": "1.2", "con": "Clinical Judgment"}, {"id": "M2-022", "t": 2, "topic": "targets", "stem": "An anticonvulsant mood stabilizer that acts by binding the alpha-2-delta subunit or by modulating sodium channel state is acting on which class of target?", "opts": ["A plasma membrane transporter", "A G-protein-linked receptor", "A voltage-sensitive ion channel", "A ligand-gated ion channel"], "a": 2, "r": "Voltage-sensitive channels are gated by membrane potential rather than by transmitter binding, and several anticonvulsant mood stabilizers act by modifying their state or their associated subunits. This target class produces effects on neuronal excitability rather than on a specific transmitter system.", "mo": [6, 7], "co": [2, 3], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-023", "t": 3, "topic": "targets", "stem": "Which feature best explains why irreversible inhibition of monoamine oxidase requires a prolonged washout before starting an interacting agent?", "opts": ["The inhibitor has an extremely long plasma half-life", "Enzyme function returns only as new enzyme protein is synthesized, which takes roughly two weeks regardless of how quickly the drug itself clears", "The inhibitor is stored in adipose tissue and released slowly", "Renal clearance of the inhibitor is negligible"], "a": 1, "r": "With irreversible inhibition, the relevant time constant is enzyme resynthesis rather than drug clearance. The drug may be gone from plasma within a day while the functional deficit persists for weeks. This distinction is the entire basis for mandated washout intervals with this class.", "mo": [8], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-024", "t": 2, "topic": "targets", "stem": "Which pairing of target class with expected onset characteristic is correct?", "opts": ["Ligand-gated ion channel with onset over several weeks", "G-protein-linked receptor with millisecond onset of full clinical effect", "Ligand-gated ion channel with rapid onset and rapid offset, and susceptibility to tolerance and withdrawal", "Voltage-sensitive ion channel with effects mediated entirely through gene transcription"], "a": 2, "r": "Ionotropic targets act in milliseconds and offset quickly, which is why agents acting there produce rapid symptomatic relief but are prone to tolerance and withdrawal. G-protein-linked targets act over seconds to hours at the signaling level and change gene expression over days to weeks, so their full clinical effect lags occupancy.", "mo": [6, 7], "co": [2, 3], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-025", "t": 3, "topic": "affinity", "stem": "Drug A and drug B compete for the same receptor. Drug A has substantially higher affinity but only partial intrinsic activity; drug B is a full agonist. What happens when drug A is added to a system saturated with drug B?", "opts": ["Signaling increases, because drug A has higher affinity", "Signaling decreases, because drug A displaces drug B and produces only submaximal output", "Signaling is unchanged, because affinity does not affect occupancy", "Signaling falls below the constitutive baseline"], "a": 1, "r": "Affinity determines who occupies the receptor and intrinsic activity determines the output. A high-affinity partial agonist wins the competition and then delivers less signal than the full agonist it displaced, so net signaling falls. Falling below constitutive baseline would require inverse agonism, which is a different property.", "mo": [1], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-026", "t": 4, "topic": "affinity", "stem": "Two dopamine antagonists achieve identical receptor occupancy, but one dissociates rapidly from the receptor and the other dissociates slowly. Which prediction follows?", "opts": ["The rapidly dissociating agent will produce more extrapyramidal symptoms", "The rapidly dissociating agent will permit physiologic dopamine surges to transiently outcompete it, and is expected to produce fewer motor and prolactin effects", "Dissociation rate has no bearing on clinical effect at equal occupancy", "The slowly dissociating agent will have lower affinity by definition"], "a": 1, "r": "Occupancy measured at a single time point does not capture the dynamics. An antagonist that leaves the receptor quickly allows phasic dopamine release to reach the receptor transiently, preserving physiologic signaling in motor and tuberoinfundibular pathways while still providing tonic blockade. This is the standard explanation for why agents with comparable occupancy can differ substantially in motor and endocrine burden.", "mo": [1], "co": [2, 3, 5], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-027", "t": 3, "topic": "affinity", "stem": "Which adaptive change is expected after sustained exposure to a receptor agonist, and what clinical phenomenon does it produce?", "opts": ["Receptor upregulation and sensitization, producing increased drug effect over time", "Receptor downregulation and desensitization, producing tolerance and withdrawal phenomena on abrupt discontinuation", "No adaptation, since receptor number is genetically fixed", "Conversion of the receptor from metabotropic to ionotropic signaling"], "a": 1, "r": "Sustained agonism drives internalization and reduced sensitivity, producing tolerance during treatment and a hyposensitive system when the agonist is abruptly removed, which is the substrate for withdrawal. Sustained antagonism drives the opposite adaptation, upregulation and supersensitivity.", "mo": [1], "co": [2, 5], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-028", "t": 2, "topic": "cascade", "stem": "Which sequence correctly describes activation of a canonical G-protein-coupled receptor pathway?", "opts": ["Second messenger, receptor binding, G protein, kinase", "Receptor binding, G protein activation, effector enzyme activation, second messenger generation, kinase activation", "Kinase activation, receptor binding, transcription factor, second messenger", "G protein activation, receptor binding, phosphatase activation, second messenger"], "a": 1, "r": "The transmitter binds first, which activates the associated G protein, which regulates an effector enzyme such as adenylate cyclase or phospholipase C, which generates the second messenger, which activates a kinase. Each step amplifies the signal and adds delay.", "mo": [2, 3], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-029", "t": 3, "topic": "cascade", "stem": "What is the functional significance of the balance between protein kinases and protein phosphatases?", "opts": ["Kinases and phosphatases both add phosphate groups, doubling the signal", "Kinases add phosphate groups and phosphatases remove them, so their relative activity sets the operating state of the target protein", "Phosphatases activate the receptor while kinases inactivate it", "Phosphatases are found only in glia"], "a": 1, "r": "Phosphorylation is a reversible switch, and the position of that switch at any moment reflects the ratio of kinase to phosphatase activity rather than kinase activity alone. This is why signaling can be modulated by acting on either side of the balance and why the system can return to baseline once the first messenger is gone.", "mo": [4], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-030", "t": 3, "topic": "cascade", "stem": "A single neurotransmitter molecule binding one receptor can produce a very large intracellular response. Which property of the cascade accounts for this?", "opts": ["Direct proportionality between receptor occupancy and effect", "Signal amplification, in which one activated receptor generates many second messenger molecules and each kinase phosphorylates many substrate proteins", "Storage of the transmitter inside the nucleus", "Conversion of the transmitter into a hormone"], "a": 1, "r": "Each step in the cascade is catalytic, so the signal is multiplied at every stage. Amplification explains how relatively low receptor occupancy can produce substantial cellular and clinical effects, and it is part of why occupancy alone is an incomplete predictor of drug effect.", "mo": [2, 3, 4], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-031", "t": 2, "topic": "cascade", "stem": "Which statement describes a variation from the canonical G-protein-coupled pathway?", "opts": ["All G-protein-coupled receptors increase cyclic adenosine monophosphate", "Some receptors couple to inhibitory G proteins and reduce second messenger production, and some cascades are initiated by receptor tyrosine kinases rather than by G proteins", "Second messengers cannot influence gene expression", "Kinases act only in the cytoplasm and never affect transcription"], "a": 1, "r": "Receptors couple to stimulatory or inhibitory G proteins, so the same second messenger system can be driven in either direction depending on the receptor engaged. Neurotrophin signaling proceeds through receptor tyrosine kinases, a structurally different route that converges on similar downstream effects including transcriptional change.", "mo": [2, 3], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-032", "t": 2, "topic": "plasticity", "stem": "Sustained glucocorticoid exposure is associated with which regional pattern of structural change?", "opts": ["Dendritic hypertrophy in hippocampus and atrophy in amygdala", "Dendritic atrophy and reduced neurogenesis in hippocampus with dendritic hypertrophy in amygdala", "Uniform atrophy across all brain regions", "Structural change confined to the cerebellum"], "a": 1, "r": "The pattern is regionally divergent, which is precisely why it produces the observed clinical picture: impaired contextual memory and executive control alongside heightened and less well-regulated threat reactivity. Recognizing this divergence prevents the oversimplification that stress simply damages the brain uniformly.", "mo": [5], "co": [2], "dom": "1", "comp": "1.2", "con": "Evidence-Based Practice"}, {"id": "M2-033", "t": 3, "topic": "plasticity", "stem": "Which finding provides the strongest conceptual support for the neurotrophic model of mood disorder?", "opts": ["Monoamine levels fall immediately after transporter blockade", "Antidepressant response emerges on the same time course as changes in neurotrophic signaling and synaptic remodeling, rather than on the time course of receptor occupancy", "Receptor occupancy correlates perfectly with symptom improvement", "Depression is diagnosed by serum neurotrophin assay"], "a": 1, "r": "The mismatch between immediate receptor occupancy and delayed clinical response is the central observation that the neurotrophic model explains. The correlation of response with plasticity-related change, rather than with transmitter level, is why the field moved beyond a simple monoamine deficiency account. No serum assay diagnoses depression.", "mo": [5], "co": [2, 7], "dom": "4", "comp": "4.2", "con": "Evidence-Based Practice"}, {"id": "M2-034", "t": 3, "topic": "plasticity", "stem": "Why have agents that produce rapid synaptic effects generated particular interest in treatment-resistant depression?", "opts": ["They have no adverse effects", "They appear to compress the time course of synaptic remodeling, producing structural and clinical change over hours to days rather than weeks", "They eliminate the need for any monitoring", "They act by increasing serum cortisol"], "a": 1, "r": "The clinical interest is in speed. Agents associated with rapid induction of synaptogenesis and increased neurotrophic signaling produce measurable change on a far shorter time course than the weeks required by conventional mechanisms, which matters most in acute suicidality and in illness that has not responded to sequential trials. Rapid onset does not imply an absence of risk or of monitoring requirements.", "mo": [5], "co": [2, 3, 7], "dom": "4", "comp": "4.2", "con": "Evidence-Based Practice"}, {"id": "M2-035", "t": 2, "topic": "metab", "stem": "Which of the following best describes an active metabolite?", "opts": ["A conjugated compound with no pharmacologic activity awaiting excretion", "A product of drug metabolism that itself produces pharmacologic effect, sometimes contributing substantially to clinical response and duration", "A drug bound to plasma albumin", "A drug that has been eliminated unchanged in the urine"], "a": 1, "r": "Phase I frequently yields metabolites that remain pharmacologically active, and in some cases the metabolite accounts for much of the clinical effect and for a longer effective duration than the parent. This is why interactions affecting the converting enzyme can change effect even when the parent drug dose is unchanged.", "mo": [8], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-036", "t": 4, "topic": "elim", "stem": "A prescriber wishes to check a serum level after increasing the dose of a drug with a 30-hour half-life. What is the earliest interpretable timing?", "opts": ["12 hours after the dose increase", "Approximately 5 to 6 days after the dose increase, drawn as a trough", "Immediately after the next dose", "Three weeks after the dose increase, at any time of day"], "a": 1, "r": "Steady state requires four to five half-lives, so with a 30-hour half-life the level becomes interpretable at roughly five to six days. Drawing earlier underestimates the eventual concentration and invites unnecessary further escalation. Timing relative to the dose matters as well, since a peak level drawn in place of a trough will overestimate exposure and can prompt an inappropriate reduction.", "mo": [8], "co": [2, 5, 8], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-037", "t": 2, "topic": "cyp", "stem": "Which enzyme is most relevant when predicting an interaction between an antidepressant that potently inhibits it and an antipsychotic that is a substrate of it, resulting in elevated antipsychotic levels?", "opts": ["Cytochrome 2D6", "Uridine diphosphate glucuronosyltransferase", "Alcohol dehydrogenase", "Monoamine oxidase B"], "a": 0, "r": "The 2D6 enzyme carries a large share of the psychiatric interaction burden because several widely used antidepressants inhibit it potently and several antipsychotics and other antidepressants are substrates. When an inhibitor is added, substrate levels rise and dose-related adverse effects follow, often without any change in the substrate prescription.", "mo": [9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-038", "t": 3, "topic": "cyp", "stem": "When evaluating a possible drug interaction, which three-part analysis is most useful?", "opts": ["Cost, formulary status, and prior authorization", "Identify the substrate whose level will change, the perpetrator that inhibits or induces, and the enzyme or transporter through which they interact", "Half-life, protein binding, and volume of distribution alone", "Diagnosis, duration of illness, and prior hospitalizations"], "a": 1, "r": "Naming substrate, perpetrator, and pathway converts a memorization problem into a reasoning problem, and it immediately generates the two clinically necessary predictions: direction of the level change and time course of onset and offset. Kinetic parameters refine that prediction but do not replace it.", "mo": [9], "co": [2, 5, 8], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-039", "t": 1, "topic": "targets", "stem": "Monoamine oxidase, as a drug target, belongs to which category?", "opts": ["A transporter", "An enzyme", "A ligand-gated ion channel", "A voltage-sensitive ion channel"], "a": 1, "r": "Monoamine oxidase is a metabolizing enzyme located largely on the outer mitochondrial membrane, and inhibiting it increases the amount of transmitter available for vesicular storage and release. Enzymes constitute a distinct target category alongside receptors, transporters, and channels.", "mo": [7], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-040", "t": 2, "topic": "absorb", "stem": "An extended-release formulation is crushed by a patient who has difficulty swallowing. What is the expected consequence?", "opts": ["Reduced total absorption and therapeutic failure", "Loss of the release-controlling mechanism, producing rapid delivery of the entire dose with peak-related toxicity", "No change, since the total milligram amount is unchanged", "Increased first-pass metabolism eliminating all effect"], "a": 1, "r": "Extended-release formulations manage the rate of delivery, not the amount. Destroying the mechanism converts a controlled release into an immediate one, producing a supratherapeutic peak. This is a frequent and preventable source of harm, and swallowing difficulty should prompt a formulation change rather than manipulation of the existing product.", "mo": [7], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-041", "t": 3, "topic": "pkpd", "stem": "A patient reports taking a medication faithfully, but the serum level is undetectable and the pharmacy record shows refills obtained on schedule. Which conclusion is most defensible at this point?", "opts": ["The patient is definitely not taking the medication", "This is a pharmacokinetic finding requiring differential consideration of nonadherence, malabsorption, enzyme induction, and assay or timing error", "The drug is ineffective and should be discontinued", "The dose should be tripled immediately"], "a": 1, "r": "An undetectable level localizes the problem to kinetics but does not by itself identify the cause. Refill records document acquisition rather than ingestion, and induction, absorption problems, and specimen timing or handling error all produce the same result. Working through the differential before acting prevents both a false accusation and an unsafe dose escalation.", "mo": [6, 9], "co": [2, 4, 8], "dom": "2", "comp": "2.6", "con": "Clinical Judgment"}, {"id": "M2-042", "t": 2, "topic": "distrib", "stem": "Which statement about volume of distribution is accurate?", "opts": ["It is a physical measurement of the anatomic space a drug occupies", "It is a calculated relationship between the amount of drug in the body and the plasma concentration, and can exceed total body volume for highly tissue-bound drugs", "It is identical for all drugs of similar molecular weight", "It determines the drug's affinity for its receptor"], "a": 1, "r": "Volume of distribution is an apparent, calculated value rather than an anatomic space, which is why extensively tissue-bound drugs yield values far larger than the body itself. Its clinical use is in predicting loading requirements and in anticipating how body composition changes will affect concentration and duration.", "mo": [7], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-043", "t": 3, "topic": "metab", "stem": "Which pairing correctly matches a metabolic route with its clinical implication?", "opts": ["Glucuronidation with high vulnerability to cytochrome P450 inhibitors", "Oxidative phase I metabolism with vulnerability to cytochrome inhibitors and inducers and to reduced capacity in aging and hepatic impairment", "Renal excretion of unchanged drug with dependence on hepatic enzyme genotype", "Phase II conjugation with routine production of highly active metabolites"], "a": 1, "r": "Oxidative metabolism is the route most exposed to interaction and to age- and disease-related decline, which is why agents dependent on it require greater vigilance in older and medically complex patients. Conjugation is comparatively protected, renal elimination depends on kidney function rather than hepatic genotype, and conjugated metabolites are usually inactive.", "mo": [8, 9], "co": [2, 5, 6], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-044", "t": 2, "topic": "cascade", "stem": "Which molecule functions as a second messenger in its own right in addition to being an ion essential for neurotransmitter release?", "opts": ["Sodium", "Calcium", "Chloride", "Potassium"], "a": 1, "r": "Calcium both triggers vesicle fusion at the terminal and acts as an intracellular second messenger, binding regulatory proteins and activating calcium-dependent kinases. This dual role makes calcium handling a point where excitability and intracellular signaling converge.", "mo": [3], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-045", "t": 3, "topic": "affinity", "stem": "An allosteric modulator produces no effect when administered to a preparation containing no endogenous transmitter. What does this demonstrate?", "opts": ["The modulator has no affinity for the receptor", "Allosteric modulation is contingent on the presence of the endogenous ligand, since the modulator changes the receptor's response rather than activating it directly", "The modulator is an inverse agonist", "The receptor has been destroyed"], "a": 1, "r": "A modulator adjusts the gain of a system rather than turning it on. Without endogenous transmitter there is nothing to amplify or attenuate, so no effect appears. This contingency is the reason allosteric agents tend to preserve physiologic patterns of signaling and, in some cases, to have a wider margin than direct agonists.", "mo": [1], "co": [2, 5], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-046", "t": 4, "topic": "elim", "stem": "A patient taking a drug with a 5-day half-life and an active metabolite with a 9-day half-life must be switched to an agent that is contraindicated with it. What washout consideration applies?", "opts": ["A 48-hour washout is adequate because the parent drug clears quickly", "Washout must be based on the longer-lived active metabolite, requiring several weeks before the contraindicated agent is started", "No washout is needed if the dose is halved first", "Washout duration depends only on the new agent's half-life"], "a": 1, "r": "Elimination of the parent compound does not end the pharmacologic exposure when an active metabolite persists. The washout interval must be calculated from the longest-lived active species, which here means several weeks rather than days. Failing to account for the metabolite is a recognized route to serious interaction events.", "mo": [8, 9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-047", "t": 2, "topic": "plasticity", "stem": "Which statement about neuroplasticity is most accurate as a framework for treatment?", "opts": ["Plasticity ends after adolescence, so structural change is not a treatment target", "Plasticity is bidirectional and persists throughout life, so both adverse and restorative structural change are possible and modifiable", "Plasticity occurs only in the presence of medication", "Plasticity refers exclusively to the growth of new neurons"], "a": 1, "r": "Plasticity encompasses synaptic strengthening and weakening, dendritic remodeling, and neurogenesis in restricted regions, and it operates in both directions across the lifespan. Framing it as bidirectional and modifiable is what makes it clinically useful, since it positions psychotherapy, pharmacotherapy, exercise, and sleep as interventions acting on a common substrate.", "mo": [5], "co": [2, 3], "dom": "1", "comp": "1.2", "con": "Evidence-Based Practice"}, {"id": "M2-048", "t": 3, "topic": "cyp", "stem": "Which situation is most likely to produce a clinically significant interaction that is invisible on a standard interaction alert reviewing prescription records only?", "opts": ["Two prescription antidepressants dispensed at the same pharmacy", "A dietary or over-the-counter product that inhibits or induces a metabolizing enzyme, or a change in smoking status", "Two prescriptions written by the same prescriber", "A prescription refilled early"], "a": 1, "r": "Alert systems see prescriptions. They do not see herbal products, dietary inhibitors, over-the-counter agents, or behavioral changes such as starting or stopping smoking, all of which can shift substrate levels substantially. This is why the medication reconciliation interview must ask about these categories explicitly rather than relying on the record.", "mo": [9], "co": [2, 5, 8], "dom": "8", "comp": "8.1", "con": "Clinical Judgment"}, {"id": "M2-049", "t": 2, "topic": "targets", "stem": "Which target class change is responsible for the delayed clinical effect of agents that alter gene expression?", "opts": ["Ligand-gated ion channels, which require weeks to open", "Voltage-sensitive channels, which require enzymatic activation", "G-protein-linked receptors, whose downstream cascade must alter transcription, translation, and synaptic protein composition", "Transporters, which are synthesized only during sleep"], "a": 2, "r": "Ion channel targets act within milliseconds. The delay belongs to the metabotropic route, where the signal must travel through second messengers and kinases to the nucleus and back out as new protein. Attributing the delay to the correct target class is what allows accurate expectation setting with patients.", "mo": [2, 6, 7], "co": [2, 4], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-050", "t": 3, "topic": "absorb", "stem": "A patient takes a psychotropic together with a mineral-containing antacid and subsequently shows subtherapeutic levels. What is the most likely mechanism, and what is the corrective action?", "opts": ["Increased renal clearance; reduce fluid intake", "Chelation or binding in the gastrointestinal tract reducing absorption; separate administration times by an adequate interval", "Displacement from plasma proteins; check a free level", "Induction of hepatic enzymes; increase the dose permanently"], "a": 1, "r": "Polyvalent cations can bind certain drugs in the gut and prevent absorption. The correction is temporal separation rather than dose escalation, because raising the dose while the interaction persists produces erratic exposure and creates toxicity risk if the antacid is later stopped.", "mo": [7, 9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-051", "t": 2, "topic": "pkpd", "stem": "Which of the following is a pharmacodynamic rather than a pharmacokinetic interaction?", "opts": ["An inhibitor raising the serum level of a substrate", "An inducer lowering the serum level of a substrate", "Two agents with additive serotonergic activity producing excess serotonergic effects at normal serum levels", "An antacid reducing absorption of a psychotropic"], "a": 2, "r": "Additive effects at the target, with unchanged concentrations, define a pharmacodynamic interaction. The other three options all alter drug concentration and are therefore kinetic. Recognizing this distinction matters because a pharmacodynamic interaction cannot be managed by level monitoring.", "mo": [6, 9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment"}, {"id": "M2-052", "t": 3, "topic": "distrib", "stem": "A drug achieves high plasma concentrations but produces minimal central nervous system effect. Which explanation is most consistent?", "opts": ["The drug has excessive lipophilicity", "The drug is a substrate for efflux transport at the blood-brain barrier, or is too polar or too large to cross it", "The drug is being eliminated by the kidney", "The drug binds its receptor with excessive affinity"], "a": 1, "r": "Plasma concentration reports systemic exposure, not central exposure. Active efflux at the barrier, high polarity, or large molecular size can each keep a drug out of the brain despite substantial plasma levels. This is also the basis for deliberately designing peripherally restricted agents.", "mo": [7], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-053", "t": 2, "topic": "metab", "stem": "Hepatic metabolism converts most drugs to metabolites that are more water soluble. What is the purpose of this change?", "opts": ["To increase the drug's affinity for its receptor", "To permit renal excretion, since lipophilic compounds are extensively reabsorbed by the renal tubule", "To prolong the drug's half-life", "To allow the drug to cross the blood-brain barrier"], "a": 1, "r": "Lipophilic molecules filtered at the glomerulus are largely reabsorbed across the tubular membrane and returned to circulation. Increasing water solubility prevents that reabsorption and permits elimination. This is the underlying logic of the entire biotransformation system.", "mo": [8], "co": [2], "dom": "1", "comp": "1.1", "con": "Clinical Judgment"}, {"id": "M2-054", "t": 3, "case": "M2-CASE-A", "caseText": "A 41-year-old with schizophrenia has been clinically stable for two years on a fixed dose of an antipsychotic that is a major substrate of cytochrome 1A2. The patient has smoked one and a half packs of cigarettes daily for 20 years. During a medical admission for pneumonia, the patient stops smoking, is started on nicotine replacement, and is discharged four days later. Ten days after discharge, family reports the patient is markedly sedated, unsteady, drooling, and confused.", "stem": "What is the most likely explanation for this change?", "opts": ["Relapse of psychosis presenting with disorganization", "Loss of cytochrome 1A2 induction after smoking cessation, producing a substantial rise in antipsychotic serum concentration", "Nicotine replacement therapy directly potentiating the antipsychotic at the receptor", "Residual effects of the pneumonia"], "a": 1, "r": "Chronic smoking induces 1A2, and stopping removes that induction over roughly one to two weeks as excess enzyme is degraded, which matches the timing here precisely. Substrate levels can rise substantially, producing dose-related sedation, ataxia, sialorrhea, and confusion. Nicotine is not the inducing agent, so replacement therapy does not prevent this.", "mo": [9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "cyp"}, {"id": "M2-055", "t": 3, "case": "M2-CASE-A", "stem": "Which action should have been taken at the time smoking cessation was identified?", "opts": ["No action, since the antipsychotic dose had been stable for two years", "Anticipate de-induction, plan a proportional dose reduction with close monitoring, and obtain a serum level to guide adjustment", "Discontinue the antipsychotic entirely and restart after discharge", "Add a second antipsychotic to maintain coverage"], "a": 1, "r": "A change in smoking status is a pharmacokinetic event that requires a prospective response, not a retrospective one. Anticipating the rise, reducing the dose proportionally, and monitoring with serum levels prevents the toxicity that otherwise emerges quietly over the following one to two weeks. Stopping the antipsychotic entirely creates relapse risk, and adding a second agent compounds the problem.", "mo": [9], "co": [2, 5, 8], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "cyp"}, {"id": "M2-056", "t": 4, "case": "M2-CASE-A", "stem": "Six weeks later the patient resumes smoking at the previous rate without informing the prescriber, and the reduced dose has been continued. What should be anticipated?", "opts": ["Levels will remain stable because the dose was already adjusted", "Re-induction over one to three weeks will lower substrate levels, and on the reduced dose the patient is at risk of subtherapeutic concentrations and relapse", "Toxicity will worsen because smoking adds to the drug effect", "No change, because induction occurs only once"], "a": 1, "r": "Induction is fully reversible in both directions. Resuming smoking re-induces the enzyme over one to three weeks, and because the dose was lowered to account for its absence, the patient now faces subtherapeutic levels and relapse risk. This bidirectional vulnerability is why smoking status must be reassessed at every visit for patients on 1A2 substrates, and why the interaction should be explained to the patient directly.", "mo": [9], "co": [2, 4, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "cyp"}, {"id": "M2-057", "t": 3, "case": "M2-CASE-A", "stem": "Which counseling point about this interaction is most important for the patient and family to understand?", "opts": ["Nicotine patches will keep the medication level stable", "Any planned or unplanned change in smoking, in either direction, should be reported promptly because it changes how quickly the body clears the medication", "The medication should be stopped whenever the patient is hospitalized", "The interaction only matters for patients who smoke more than two packs daily"], "a": 1, "r": "The actionable message is that a change in smoking is a change in dosing, in both directions. Because nicotine is not the inducing agent, replacement products do not preserve the prior state, and hospitalization is the most common setting for an abrupt and unannounced change. Framing it this way gives the family a concrete trigger for contacting the prescriber.", "mo": [9], "co": [4, 5, 8], "dom": "2", "comp": "2.2", "con": "Communication", "topic": "cyp"}, {"id": "M2-058", "t": 3, "case": "M2-CASE-B", "caseText": "A 29-year-old with bipolar disorder is maintained on an anticonvulsant that is a potent inhibitor of glucuronidation. The prescriber wishes to add a second anticonvulsant mood stabilizer that is cleared almost entirely by glucuronidation and that carries a risk of serious cutaneous reaction related to rate of titration.", "stem": "What is the correct adjustment when adding the second agent?", "opts": ["Use the standard starting dose and standard titration schedule", "Reduce the starting dose of the added agent, typically by about half, and titrate substantially more slowly than usual", "Double the starting dose to overcome the inhibition", "Avoid the combination entirely under all circumstances"], "a": 1, "r": "Inhibition of glucuronidation raises exposure to the added agent substantially, and because the risk of serious rash is related to how quickly concentration rises, the standard schedule becomes hazardous. The correct response is a reduced starting dose and a markedly slower titration. The combination itself is used and can be appropriate; it is the schedule that must change.", "mo": [8, 9], "co": [2, 3, 5], "dom": "5", "
