comp": "5.2", "con": "Clinical Judgment", "topic": "metab"}, {"id": "M2-059", "t": 4, "case": "M2-CASE-B", "stem": "Eight months later, the inhibiting agent is discontinued while the second agent's dose is left unchanged. What should be anticipated and done?", "opts": ["Nothing; the second agent's dose is independent of the first", "Exposure to the second agent will fall as inhibition resolves, risking loss of efficacy, so the dose will likely need to be increased with monitoring", "Exposure will rise further, requiring an immediate dose reduction", "The second agent must be stopped abruptly"], "a": 1, "r": "Removing an inhibitor restores normal clearance, so the substrate's exposure falls and may become subtherapeutic. Interaction management is symmetric: whenever a perpetrator is added or removed, the substrate dose must be reconsidered in the opposite direction and the patient monitored through the transition. Abrupt discontinuation of a mood stabilizer would additionally risk destabilization.", "mo": [8, 9], "co": [2, 3, 5, 8], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "cyp"}, {"id": "M2-060", "t": 3, "case": "M2-CASE-B", "stem": "Which metabolic distinction explains why this particular interaction would not be predicted by reviewing a cytochrome P450 interaction table alone?", "opts": ["The interaction occurs at a phase II conjugating enzyme rather than at a cytochrome P450 enzyme", "The interaction occurs at the blood-brain barrier", "The interaction is purely pharmacodynamic", "The interaction involves renal tubular secretion"], "a": 0, "r": "Glucuronidation is a phase II route, and interactions there are not captured by cytochrome tables. This is a common blind spot: clinicians who screen only for cytochrome interactions will miss clinically important conjugation interactions entirely. Knowing which of your agents are cleared by conjugation is therefore a safety requirement, not a detail.", "mo": [8, 9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "metab"}, {"id": "M2-061", "t": 3, "case": "M2-CASE-C", "caseText": "A 52-year-old is taking an antidepressant that is a potent inhibitor of cytochrome 2D6 for a recurrent depressive episode. Following an orthopedic procedure, the surgical team prescribes an opioid analgesic that requires 2D6-mediated conversion to its active form. The patient reports the analgesic provides essentially no pain relief despite escalating doses, and asks whether they are becoming tolerant.", "stem": "What is the correct explanation for the analgesic failure?", "opts": ["Rapid tolerance to the opioid at the mu receptor", "Inhibition of 2D6 prevents conversion of the prodrug to its active metabolite, so little active analgesic is formed", "The antidepressant blocks the mu opioid receptor directly", "The opioid is being eliminated too rapidly by the kidney"], "a": 1, "r": "When the analgesic is a prodrug requiring 2D6 activation, inhibiting that enzyme produces therapeutic failure rather than toxicity. Escalating the dose does not solve it, because the conversion step is the bottleneck. The correct action is to select an analgesic that does not require 2D6 activation.", "mo": [9], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "cyp"}, {"id": "M2-062", "t": 4, "case": "M2-CASE-C", "stem": "Had this patient instead been a 2D6 ultrarapid metabolizer without any inhibitor present, what would have been the primary concern with the same analgesic?", "opts": ["Complete lack of analgesic effect", "Excessive and rapid formation of the active metabolite, with risk of sedation and respiratory depression", "Accumulation of the inactive parent compound only", "No difference from a normal metabolizer"], "a": 1, "r": "The same enzyme produces opposite clinical risks depending on phenotype. A poor metabolizer or a pharmacologically inhibited patient fails to generate the active species and gets no relief, while an ultrarapid metabolizer generates it too quickly and faces toxicity including respiratory depression. This is why prodrug analgesics are approached cautiously in populations where either phenotype is common.", "mo": [9], "co": [2, 5, 6], "dom": "1", "comp": "1.2", "con": "Clinical Judgment", "topic": "cyp"}, {"id": "M2-063", "t": 3, "case": "M2-CASE-C", "stem": "Which recommendation to the surgical team is most appropriate?", "opts": ["Increase the current analgesic dose further and reassess in 24 hours", "Communicate the interaction and recommend an analgesic that does not depend on 2D6 activation, while documenting the reasoning and the enzyme involved", "Discontinue the antidepressant for the duration of the postoperative period", "Add a second 2D6 inhibitor to slow elimination and prolong effect"], "a": 1, "r": "The correct action addresses the mechanism: change to an agent whose activity does not depend on the blocked pathway, and communicate the reason so the same error is not repeated elsewhere. Stopping the antidepressant risks discontinuation symptoms and depressive relapse during a physiologically stressful period, and adding another inhibitor compounds the blockade rather than relieving it.", "mo": [9], "co": [2, 5, 8], "dom": "6", "comp": "6.3", "con": "Communication", "topic": "cyp"}, {"id": "M2-064", "t": 3, "case": "M2-CASE-D", "caseText": "A 60-year-old with bipolar disorder has been stable for six years on a renally cleared mood stabilizer with a narrow therapeutic index. During a summer heat wave the patient develops gastroenteritis with vomiting and reduced oral intake, and has been taking a nonsteroidal anti-inflammatory drug for back pain. The patient presents with coarse tremor, vomiting, ataxia, and confusion.", "stem": "Which combination of factors best explains this presentation?", "opts": ["Hepatic enzyme inhibition raising the drug level", "Volume depletion, sodium loss, and reduced renal clearance from the nonsteroidal agent, all converging to raise the serum level of a renally cleared drug", "An allergic reaction to the mood stabilizer", "Pharmacodynamic tolerance developing after six years"], "a": 1, "r": "For a renally cleared drug with a narrow index, anything that reduces glomerular filtration or increases proximal reabsorption raises the level. Dehydration and sodium depletion do the latter, and nonsteroidal anti-inflammatory agents reduce renal blood flow. Stacked together, they can convert a stable regimen into toxicity without any prescribing change, and the neurologic findings described are the classic presentation.", "mo": [7, 8], "co": [2, 5, 6], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "elim"}, {"id": "M2-065", "t": 4, "case": "M2-CASE-D", "stem": "Which kinetic feature makes this agent particularly dangerous in this scenario?", "opts": ["Extensive plasma protein binding", "A narrow therapeutic index combined with renal elimination of unchanged drug, so clearance depends directly on volume status and renal function", "A very large volume of distribution", "Extensive first-pass metabolism"], "a": 1, "r": "The combination is what creates the hazard: a small margin between effective and toxic concentration, and a clearance route directly coupled to hydration, sodium balance, and renal perfusion. This agent is minimally protein bound and is not metabolized hepatically, which is precisely why hepatic interaction reasoning does not protect the patient here.", "mo": [7, 8], "co": [2, 5], "dom": "5", "comp": "5.2", "con": "Clinical Judgment", "topic": "elim"}, {"id": "M2-066", "t": 3, "case": "M2-CASE-D", "stem": "Which anticipatory guidance would most likely have prevented this event?", "opts": ["Advising the patient to take the medication with food", "Instructing the patient to hold the medication and contact the prescriber during illness with vomiting, diarrhea, or reduced intake, to maintain consistent salt and fluid intake, and to avoid nonsteroidal anti-inflammatory agents without const S = {
  name:"", sid:"", attempt:1, started:0, ended:0,
  queue:[], idx:0, answered:[], seen:new Set(),
  locked:false, sel:null, exhausted:false, ceiling:0
};

/* ---------- persistence (degrades to session-only) ---------- */
const KEY = "mastery_"+BANK.module;
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

/* ---------- utilities ---------- */
const $ = s=>document.getElementById(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hhmmss(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return (h?h+"h ":"")+m+"m "+String(x).padStart(2,"0")+"s"; }
function checksum(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return h.toString(36).toUpperCase().padStart(7,"0"); }

/* ---------- item selection ---------- */
/* Builds a delivery order that (a) prefers items not seen on prior attempts,
   (b) keeps multi-question case clusters together, and (c) escalates difficulty. */
function buildQueue(){
  const prev = load(); const seenPrior = new Set(prev?prev.seen:[]);
  const items = BANK.items.slice();
  // group by case
  const cases = {}; const singles = [];
  items.forEach(q=>{ if(q.case){ (cases[q.case]=cases[q.case]||[]).push(q); } else singles.push(q); });
  const units = Object.keys(cases).map(k=>cases[k].sort((a,b)=>a.id.localeCompare(b.id))).concat(singles.map(q=>[q]));
  units.forEach(u=>{ u.fresh = u.every(q=>!seenPrior.has(q.id)); u.tier = Math.max.apply(null,u.map(q=>q.t)); });
  const fresh = shuffle(units.filter(u=>u.fresh));
  const used  = shuffle(units.filter(u=>!u.fresh));
  const pool  = fresh.concat(used);
  // difficulty escalation: order by tier within thirds of the pool
  const byTier = {1:[],2:[],3:[],4:[]};
  pool.forEach(u=>byTier[u.tier].push(u));
  const order = [];
  if(BANK.mode==="exam"){
    // exam: blueprint-balanced, gently ascending
    [1,2,3,4].forEach(t=>byTier[t].forEach(u=>order.push(u)));
  } else {
    // mastery: warm up, then climb, interleaving so topics vary
    const ramp = [1,1,2,2,3,2,3,4,3,4];
    let ptr={1:0,2:0,3:0,4:0}, guard=0;
    while(order.length<pool.length && guard<5000){
      guard++;
      for(const t of ramp){
        let tt=t;
        while(tt<=4 && ptr[tt]>=byTier[tt].length) tt++;
        if(tt>4){ tt=t; while(tt>=1 && ptr[tt]>=byTier[tt].length) tt--; }
        if(tt>=1 && tt<=4 && ptr[tt]<byTier[tt].length){ order.push(byTier[tt][ptr[tt]++]); }
      }
    }
  }
  const flat=[]; order.forEach(u=>u.forEach(q=>flat.push(q)));
  const cap = BANK.mode==="exam" ? Math.min(BANK.examLength, flat.length) : Math.min(BANK.cap, flat.length);
  S.queue = flat.slice(0,cap);
  S.ceiling = S.queue.length;
  S.exhausted = (BANK.mode!=="exam" && flat.length < BANK.cap);
}

/* ---------- mastery decision ---------- */
function stats(){
  const n=S.answered.length, c=S.answered.filter(a=>a.ok).length;
  const recent=S.answered.slice(-BANK.window), rc=recent.filter(a=>a.ok).length;
  return {n,c,pct:n?Math.round(c/n*1000)/10:0, rn:recent.length, rpct:recent.length?Math.round(rc/recent.length*1000)/10:0};
}
function masteryMet(){
  if(BANK.mode==="exam") return null;
  const s=stats();
  if(s.n<BANK.minItems) return false;
  if(s.pct<BANK.passing) return false;
  if(s.rn>=BANK.window && s.rpct<BANK.passing) return false;
  // every topic touched must be at or above threshold on >=2 items
  const t=topicRoll();
  for(const k in t){ if(t[k].n>=2 && (t[k].c/t[k].n*100)<BANK.passing) return false; }
  return true;
}
function topicRoll(){ const m={}; S.answered.forEach(a=>{ const k=a.q.topic; m[k]=m[k]||{n:0,c:0}; m[k].n++; if(a.ok)m[k].c++; }); return m; }
function roll(field){ const m={}; S.answered.forEach(a=>{ let v=a.q[field]; (Array.isArray(v)?v:[v]).forEach(x=>{ const k=String(x); m[k]=m[k]||{n:0,c:0}; m[k].n++; if(a.ok)m[k].c++; }); }); return m; }

function renderItem(){
  if(S.idx>=S.queue.length){ return finish(S.exhausted?"exhausted":"cap"); }
  const q=S.queue[S.idx]; S.locked=false; S.sel=null;
  const s=stats(); const exam=BANK.mode==="exam";
  const total = S.queue.length;
  const pct = Math.round((S.idx/total)*100);
  const showCase = q.case && (S.idx===0 || S.queue[S.idx-1].case!==q.case || true);
  const clusterN = q.case ? S.queue.filter(x=>x.case===q.case).length : 0;
  const clusterI = q.case ? S.queue.filter((x,i)=>x.case===q.case && i<=S.idx).length : 0;

  $("app").innerHTML = `
  <div class="rail">
    <span>Item <b>${S.idx+1}</b>${exam?` of <b>${S.queue.length}</b>`:` &middot; ceiling <b>${S.ceiling}</b>`}</span>
    ${exam?`<span>Answered <b>${s.n}</b></span>`:`<span>Running accuracy <b>${s.n?s.pct+"%":"&mdash;"}</b> &middot; target <b>${BANK.passing}%</b></span>`}
    <span>Elapsed <b id="clk">0m 00s</b></span>
  </div>
  <div class="meter"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="tier t${q.t}">Difficulty ${q.t} &middot; ${["","Recall","Application","Analysis","Synthesis"][q.t]}</span>
      ${q.case?`<span class="note">Case set &mdash; question ${clusterI} of ${clusterN}</span>`:""}
    </div>
    ${q.caseText?`<div class="casebox"><div class="clabel">Clinical vignette</div>${q.caseText}</div>`
      : (q.case&&showCase? `<div class="casebox"><div class="clabel">Clinical vignette (continued)</div>${caseTextFor(q.case)}</div>`:"")}
    <div class="stem">${q.stem}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${"ABCDE"[i]}</span><span>${o}</span></button>`).join("")}
    </div>
    <div id="fbslot"></div>
    <div class="actions">
      <button id="submit" class="ghost" disabled>Submit answer</button>
      <button id="next" class="hide">${exam?"Next":"Continue"}</button>
    </div>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(S.locked) return;
    document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); S.sel=parseInt(b.dataset.i); $("submit").disabled=false;
  });
  $("submit").onclick=()=>answer(q);
  $("next").onclick=()=>{ S.idx++; const m=masteryMet(); if(m===true) return finish("mastered"); renderItem(); };
  tick();
}
function caseTextFor(cid){ const f=BANK.items.find(x=>x.case===cid&&x.caseText); return f?f.caseText:""; }

let clkTimer=null;
function tick(){ if(clkTimer) clearInterval(clkTimer);
  const f=()=>{ const e=$("clk"); if(e) e.textContent=hhmmss(Date.now()-S.started); };
  f(); clkTimer=setInterval(f,1000); }

function answer(q){
  if(S.locked) return; S.locked=true;
  const ok = S.sel===q.a;
  S.answered.push({q, sel:S.sel, ok, at:Date.now()});
  S.seen.add(q.id);
  const exam = BANK.mode==="exam";
  document.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled=true;
    if(exam){ if(i===S.sel) b.classList.add("sel"); return; }
    if(i===q.a) b.classList.add("ok");
    else if(i===S.sel) b.classList.add("no");
  });
  $("submit").classList.add("hide"); $("next").classList.remove("hide"); $("next").focus();
  if(!exam){
    $("fbslot").innerHTML = `
      <div class="fb ${ok?"":"wrong"}">
        <div class="h">${ok?"Correct":"Not correct &mdash; correct answer: "+"ABCDE"[q.a]}</div>
        <div>${q.r}</div>
        <div class="tags">Module objective ${[].concat(q.mo).join(", ")} &nbsp;|&nbsp; Course objective ${[].concat(q.co).join(", ")} &nbsp;|&nbsp; Essentials Domain ${q.dom} &middot; Competency ${q.comp} &nbsp;|&nbsp; Concept: ${q.con}</div>
      </div>`;
  }
}

  const s=stats();
  const passed = BANK.mode==="exam" ? s.pct>=BANK.passing : reason==="mastered";
  prev.attempts=(prev.attempts||0)+1; prev.seen=Array.from(seenAll);
  prev.history=(prev.history||[]).concat([{a:S.attempt,pct:s.pct,n:s.n,ms:S.ended-S.started,pass:passed,d:new Date().toISOString()}]);

    </tbody></table>

    <h2>Prescription for study</h2>
    ${weak.length? weak.map(k=>rxCard(k,topics[k])).join("") :
      `<div class="rx"><div class="t">No content area fell below standard</div><p class="note">Every topic sampled in this attempt met the ${BANK.passing}% threshold. To consolidate, teach one of these topics aloud to a peer without notes, then attempt a harder application: take a patient you have seen in clinical and re-derive the reasoning end to end.</p></div>`}
    ${strong.length?`<h3>Content areas at or above standard</h3><p class="note">${strong.map(k=>esc(BANK.topics[k]?BANK.topics[k].name:k)).join(" &middot; ")}</p>`:""}

    <h2>Submit your result</h2>
    <div class="rules">
      <strong>What to upload</strong>
      <ul>
        ${SUBMIT.formId?`<li>Select <span class="kbd">Submit result to course gradebook</span> below. The submission form opens with your name, score, time, attempt number, and verification code already filled in. Review it, attach your screenshot, and submit.</li>`:""}
        <li>Select <span class="kbd">Download result file</span> below and upload the file it produces to the Module ${esc(BANK.module)} submission link.</li>
        <li>If your device blocks the download, select <span class="kbd">Copy result code</span> and paste the code into the submission comment box.</li>
        <li>Also upload a screenshot of this results page showing your name, score, time on task, and attempt number.</li>
        <li>${BANK.mode==="exam"?"Submit even if you did not meet the standard. The score is recorded as earned.":"Submit the attempt in which you demonstrated mastery. If you reached the ceiling without mastery, submit that attempt as well so your effort is recorded, then complete a new attempt after studying."}</li>
      </ul>
    </div>
    <div class="receipt" id="rcpt">${esc(receipt)}</div>
    <div class="actions">
      ${SUBMIT.formId?`<button id="send">Submit result to course gradebook</button>`:""}
      <button id="dl" class="${SUBMIT.formId?"ghost":""}">Download result file</button>
      <button id="cp" class="ghost">Copy result code</button>
      <button id="dlcsv" class="ghost">Download gradebook line</button>
      ${BANK.mode==="exam"?"":`<button id="again" class="ghost">Start a new attempt</button>`}
    </div>
  </div>`;

  const sb=$("send");
  if(sb) sb.onclick=()=>{
    const w=weak.map(k=>(BANK.topics[k]?BANK.topics[k].name:k)).join("; ");
    window.open(submitUrl(s,totalMs,passed,receipt,w),"_blank","noopener");
  };
  $("dl").onclick=()=>dl(fileName("txt"), receipt, "text/plain");
  $("dlcsv").onclick=()=>dl(fileName("csv"), csv, "text/csv");
  $("cp").onclick=()=>{ navigator.clipboard.writeText(receipt).then(()=>{ $("cp").textContent="Copied"; setTimeout(()=>$("cp").textContent="Copy result code",1800); }); };
  const ag=$("again"); if(ag) ag.onclick=()=>{ S.queue=[];S.idx=0;S.answered=[];S.seen=new Set();S.locked=false; screenStart(); };
}
function bar(p){ const c=p>=BANK.passing?"":(p>=70?"mid":"low"); return `<span class="bar ${c}"><i style="width:${p}%"></i></span>`; }
function fileName(ext){ return `${BANK.courseCode}_M${BANK.module}_${S.name.replace(/[^A-Za-z0-9]+/g,"-")}_${S.sid.replace(/[^A-Za-z0-9]+/g,"")}_attempt${S.attempt}.${ext}`; }
function dl(name,content,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }

function rxCard(k,d){
  const t=BANK.topics[k]||{name:k,study:"",stahl:"",kaplan:"",media:""};
  const p=Math.round(d.c/d.n*100);
  return `<div class="rx">
    <div class="t">${esc(t.name)}</div>
    <div class="pct">${d.c} of ${d.n} correct &middot; ${p}% &middot; standard ${BANK.passing}%</div>
    <div>${t.study}</div>
    <div class="lbl">Read &mdash; Stahl (current edition)</div><div>${t.stahl}</div>
    <div class="lbl">Read &mdash; Kaplan &amp; Sadock</div><div>${t.kaplan}</div>
    <div class="lbl">Watch</div><div>${t.media}</div>
  </div>`;
}

function buildReceipt(s,ms,passed,reason,doms,cos,topics){
  const L=[];
  L.push("================================================================");
  L.push(BANK.courseCode+"  MODULE "+BANK.module+"  RESULT RECORD");
  L.push(BANK.title);
  L.push("================================================================");
  L.push("Student name .......... "+S.name);
  L.push("Student ID ............ "+S.sid);
  L.push("Assessment type ....... "+(BANK.mode==="exam"?"Cumulative examination (single attempt)":"Mastery learning activity (repeatable)"));
  L.push("Attempt number ........ "+S.attempt);
  L.push("Date / time ........... "+new Date().toString());
  L.push("Items answered ........ "+s.n);
  L.push("Items correct ......... "+s.c);
  L.push("SCORE ................. "+s.pct+"%");
  L.push("Standard .............. "+BANK.passing+"%");
  L.push("Outcome ............... "+(passed?(BANK.mode==="exam"?"STANDARD MET":"MASTERY DEMONSTRATED"):(BANK.mode==="exam"?"BELOW STANDARD":"MASTERY NOT YET DEMONSTRATED")));
  L.push("Time on task .......... "+hhmmss(ms));
  L.push("Stop condition ........ "+({mastered:"Mastery criteria satisfied",cap:"Question ceiling reached",exhausted:"Attempt item pool completed"}[reason]||"Examination completed"));
  L.push("");
  L.push("--- COURSE OBJECTIVE PERFORMANCE ---");
  Object.keys(cos).sort((a,b)=>a-b).forEach(k=>{const d=cos[k];L.push("CO "+k+"  "+String(d.c+"/"+d.n).padEnd(8)+Math.round(d.c/d.n*100)+"%");});
  L.push("");
  L.push("--- ESSENTIALS DOMAIN PERFORMANCE ---");
  Object.keys(doms).sort().forEach(k=>{const d=doms[k];L.push("Domain "+k+"  "+String(d.c+"/"+d.n).padEnd(8)+Math.round(d.c/d.n*100)+"%");});
  L.push("");
  L.push("--- CONTENT AREA PERFORMANCE ---");
  Object.keys(topics).forEach(k=>{const d=topics[k];const nm=(BANK.topics[k]?BANK.topics[k].name:k);
    L.push(String(nm).slice(0,46).padEnd(48)+String(d.c+"/"+d.n).padEnd(8)+Math.round(d.c/d.n*100)+"%");});
  L.push("");
  const body=L.join("\n");
  return body+"\nVerification ......... "+checksum(S.name+S.sid+s.pct+s.n+S.attempt+BANK.module)+"\n================================================================";
}
function submitUrl(s,ms,passed,receipt,weakNames){
  const f=SUBMIT.fields, p=[];
  const add=(k,v)=>{ if(k&&v!==undefined&&v!==null&&v!=="") p.push(encodeURIComponent(k)+"="+encodeURIComponent(v)); };
  add(f.name,S.name); add(f.sid,S.sid);
  add(f.course,SUBMIT.course); add(f.section,SUBMIT.section);
  add(f.term,SUBMIT.term); add(f.year,SUBMIT.year);
  add(f.assessment,BANK.title);
  add(f.maxScore,100); add(f.passScore,BANK.passing);
  add(f.module,(BANK.mode==="exam"?"Week "+BANK.module:"Module "+BANK.module)+" \u2014 Week "+(BANK.week||BANK.module));
  add(f.type,BANK.mode==="exam"?"Cumulative examination (single attempt)":"Mastery learning activity (repeatable)");
  add(f.attempt,S.attempt); add(f.score,s.pct); add(f.answered,s.n); add(f.correct,s.c);
  add(f.minutes,Math.round(ms/6000)/10);
  add(f.outcome, BANK.mode==="exam" ? (passed?"Examination standard met":"Examination below standard")
                                    : (passed?"Mastery demonstrated":"Mastery not yet demonstrated"));
  add(f.verify,checksum(S.name+S.sid+s.pct+s.n+S.attempt+BANK.module));
  add(f.record,receipt);
  add(f.weak,weakNames);
  return "https://form.jotform.com/"+SUBMIT.formId+"?"+p.join("&");
}
function buildCSV(s,ms,passed,doms,cos,topics){
  const h=["Student name","Student ID","Course","Module","Assessment type","Attempt number","Date","Items answered","Items correct","Score %","Standard %","Outcome","Time on task (min)","Verification"];
  const r=[S.name,S.sid,BANK.courseCode,BANK.module,(BANK.mode==="exam"?"Examination":"Mastery activity"),S.attempt,new Date().toISOString(),s.n,s.c,s.pct,BANK.passing,(passed?"Met":"Not met"),(Math.round(ms/6000)/10),checksum(S.name+S.sid+s.pct+s.n+S.attempt+BANK.module)];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  return h.map(q).join(",")+"\n"+r.map(q).join(",")+"\n";
}

screenStart();
</script>
